name: AI SEO Agent

on:
  push:
    branches:
      - main
    paths:
      - 'src/app/**/page.tsx'
      - 'src/app/**/layout.tsx'

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push commits back to the repo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Needed to diff against the previous commit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Get changed files
        id: changed-files
        run: |
          # Get list of changed files
          FILES=$(git diff --name-only HEAD^ HEAD | grep -E '^src/app/.*\.(page|layout)\.tsx$' || true)
          # Convert to space-separated string for passing to node script
          FILES_SPACE=$(echo "$FILES" | tr '\n' ' ')
          echo "files=$FILES_SPACE" >> $GITHUB_OUTPUT

      - name: Run SEO Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FILES="${{ steps.changed-files.outputs.files }}"
          
          if [ -z "$FILES" ] || [ "$FILES" = " " ]; then
            echo "No Next.js pages or layouts were changed in this push."
            exit 0
          fi
          
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Error: GEMINI_API_KEY is not set in repository secrets."
            exit 1
          fi
          
          echo "Running SEO agent on: $FILES"
          npx tsx scripts/seo-agent.ts $FILES

      - name: Commit and Push SEO Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(seo): auto-generate and inject SEO metadata [skip ci]"
          branch: main
          file_pattern: 'src/app/**/*.tsx'
