<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="160" fill="url(#primaryGrad)" opacity="0.2" filter="url(#glow)"/>

  <!-- Convert Arrow Cycle Graphic -->
  <g transform="translate(64, 64)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Right Arrow Arc -->
    <path d="M 80,192 A 112,112 0 0,1 304,192" fill="none" stroke="url(#primaryGrad)" stroke-width="40"/>
    <polygon points="304,144 352,192 304,240" fill="url(#primaryGrad)"/>

    <!-- Bottom Left Arrow Arc -->
    <path d="M 304,192 A 112,112 0 0,1 80,192" fill="none" stroke="url(#accentGrad)" stroke-width="40"/>
    <polygon points="80,240 32,192 80,144" fill="url(#accentGrad)"/>

    <!-- Center Lightning / Bolt Symbol -->
    <polygon points="192,112 160,208 208,208 176,288 240,176 192,176" fill="#ffffff" filter="url(#glow)"/>
  </g>
</svg>
