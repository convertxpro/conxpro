<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Tech Radial & Linear Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Vibrant Apex Primary Gradient -->
    <linearGradient id="apexPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Cyan / Emerald High-Energy Accent -->
    <linearGradient id="apexAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle Container -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3"/>
  <rect x="12" y="12" width="488" height="488" rx="106" fill="none" stroke="url(#apexPrimary)" stroke-width="1.5" opacity="0.4"/>

  <!-- Ambient Glowing Orb behind Apex -->
  <circle cx="256" cy="240" r="130" fill="url(#apexPrimary)" opacity="0.25" filter="url(#glowEffect)"/>

  <!-- Apex Peak Geometry (Stylized Geometric 'A' / Peak Layer Structure) -->
  <g filter="url(#subtleShadow)" transform="translate(0, -6)">
    <!-- Left Wing of Apex Peak -->
    <path d="M 256,92 L 118,348 L 174,348 L 256,196 L 338,348 L 394,348 Z" fill="url(#apexPrimary)"/>

    <!-- Inner Floating Speed Wedge / Core Peak Blade -->
    <path d="M 256,152 L 196,286 L 230,286 L 256,236 L 282,286 L 316,286 Z" fill="url(#apexAccent)" opacity="0.95"/>

    <!-- High-Tech Cross Precision Intersect -->
    <path d="M 160,378 L 352,378 L 334,408 L 178,408 Z" fill="url(#apexAccent)" opacity="0.85"/>

    <!-- Center Apex Shimmer Diamond Dot -->
    <circle cx="256" cy="116" r="10" fill="#ffffff" filter="url(#glowEffect)"/>
  </g>
</svg>
